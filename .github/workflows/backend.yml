name: Backend

# KlimaBilanz cloud backend: Cloudflare Worker "klimabilanz-api" + D1 database "klimabilanz" (EU jurisdiction).
# Contract: docs/CLOUDFLARE_BACKEND.md §5 · user guide: docs/SETUP.md §3.
#
#   test    every push that touches backend/** (and manual runs): typecheck, Worker tests on local D1, deploy-helper
#           self-tests, bundle dry run.
#   gate    decides whether to deploy. Deploys happen only on main / claude/klimabilanz-ios-app or a manual run
#           ("Run workflow"), so a work-in-progress branch can never replace the Worker that installed apps use, and
#           only when the repository secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID exist. Otherwise the run
#           stays green and the summary says why nothing was deployed.
#   deploy  workers.dev subdomain → find-or-create D1 (EU) → render wrangler.toml → migrate → secrets from GitHub
#           (+ one-time SESSION_SIGNING_KEY) → deploy → prune provider secrets deleted in GitHub → smoke test → summary.
#
# Changing a GitHub secret does not trigger a run: use Actions › Backend › Run workflow afterwards.

on:
  push:
    branches: ['**']
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKER_NAME: klimabilanz-api   # = `name` in backend/wrangler.template.toml
  D1_NAME: klimabilanz           # = `database_name` in backend/wrangler.template.toml
  WRANGLER_SEND_METRICS: "false"

jobs:
  test:
    name: Worker tests (D1 lokal)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Worker tests (vitest in workerd, local D1)
        run: npm test

      - name: Deploy helper self-tests
        run: node --test scripts/*.selftest.mjs

      - name: Bundle check (dry run, no upload)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/kb-dist" -c wrangler.template.toml

  gate:
    name: Bereitstellung prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Gate
        id: gate
        env:
          # Only "true"/"false" reach this job, never the secret values.
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'claude/klimabilanz-ios-app' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            MSG="CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID fehlen – siehe docs/SETUP.md §3"
            echo "::notice title=Backend nicht bereitgestellt::$MSG"
            echo "### Backend nicht bereitgestellt" >> "$GITHUB_STEP_SUMMARY"
            echo "$MSG. Die App funktioniert bis dahin lokal ohne Konto." >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$DEPLOY_BRANCH" != "true" ]; then
            MSG="Bereitgestellt wird nur von main bzw. claude/klimabilanz-ios-app oder über Actions › Backend › Run workflow (Branch: ${GITHUB_REF_NAME})."
            echo "::notice title=Backend nicht bereitgestellt::$MSG"
            echo "### Backend nicht bereitgestellt" >> "$GITHUB_STEP_SUMMARY"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare-Secrets vorhanden – Bereitstellung läuft."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy (Cloudflare)
    needs: [test, gate]
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: backend-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    # The Cloudflare token is passed only to the steps that call Cloudflare (never job-wide): `npm ci` runs the
    # install scripts of ~100 packages, and none of them needs to see it.
    env:
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Worker URL (workers.dev subdomain)
        id: url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/kb-subdomain.json"
          CODE=$(curl -sS --max-time 30 -o "$BODY" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain") || CODE=000
          SUB=$(jq -r '.result.subdomain // empty' "$BODY" 2>/dev/null || true)
          if [ "$CODE" != "200" ] || [ -z "$SUB" ]; then
            jq -r '(.errors // [])[] | "Cloudflare-Fehler \(.code): \(.message)"' "$BODY" 2>/dev/null || true
            case "$CODE" in
              401|403) echo "::error title=Cloudflare-API-Token::Token ungültig oder ohne Berechtigung 'Workers Scripts · Edit' für dieses Konto, oder CLOUDFLARE_ACCOUNT_ID passt nicht dazu (docs/SETUP.md §3)." ;;
              *) echo "::error title=Keine workers.dev-Subdomain::Öffne einmal *Workers & Pages* im Cloudflare-Dashboard, um eine workers.dev-Subdomain anzulegen (HTTP $CODE; docs/SETUP.md §3)." ;;
            esac
            exit 1
          fi
          BASE="${API_BASE_URL%/}"
          if [ -n "$BASE" ]; then
            if ! [[ "$BASE" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
              echo "::error title=API_BASE_URL::Die Repository-Variable API_BASE_URL muss so aussehen: https://api.example.at (ohne Pfad)."
              exit 1
            fi
          else
            BASE="https://$WORKER_NAME.$SUB.workers.dev"
          fi
          {
            echo "workers_dev=https://$WORKER_NAME.$SUB.workers.dev"
            echo "base=$BASE"
          } >> "$GITHUB_OUTPUT"
          echo "Worker-URL: $BASE"

      - name: D1 database (find or create, EU jurisdiction)
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LIST="$RUNNER_TEMP/kb-d1-list.json"
          fail() {
            echo "::error title=D1::Die D1-Datenbank '$D1_NAME' konnte nicht gelesen oder angelegt werden – hat das API-Token die Berechtigung 'D1 · Edit'? (docs/SETUP.md §3)"
            exit 1
          }
          # find_db: exit 0 = found (prints uuid=/jurisdiction=), 2 = no such database, anything else = error.
          find_db() {
            npx wrangler d1 list --json > "$LIST" || return 1
            node scripts/find-d1.mjs "$D1_NAME" < "$LIST"
          }
          set +e; INFO=$(find_db); RC=$?; set -e
          CREATED=false
          if [ "$RC" = "2" ]; then
            echo "D1-Datenbank '$D1_NAME' existiert noch nicht – wird in der EU angelegt."
            npx wrangler d1 create "$D1_NAME" --jurisdiction eu || fail
            CREATED=true
            set +e; INFO=$(find_db); RC=$?; set -e
          fi
          [ "$RC" = "0" ] || fail
          UUID=$(sed -n 's/^uuid=//p' <<<"$INFO")
          JURISDICTION=$(sed -n 's/^jurisdiction=//p' <<<"$INFO")
          if [ -n "$JURISDICTION" ] && [ "$JURISDICTION" != "eu" ]; then
            echo "::warning title=D1 nicht in der EU::'$D1_NAME' hat die Jurisdiktion '$JURISDICTION'. Sie lässt sich nachträglich nicht ändern – zum Umziehen die Datenbank im Dashboard löschen (Daten gehen verloren) und Backend erneut ausführen."
          elif [ -z "$JURISDICTION" ] && [ "$CREATED" = "false" ]; then
            echo "::notice title=D1-Jurisdiktion::Cloudflare meldet für '$D1_NAME' keine Jurisdiktion. Wurde sie vor diesem Workflow ohne 'EU' angelegt, liegen die Daten nicht garantiert in der EU."
          fi
          {
            echo "id=$UUID"
            echo "jurisdiction=${JURISDICTION:-–}"
            echo "created=$CREATED"
          } >> "$GITHUB_OUTPUT"
          echo "D1: $D1_NAME (Jurisdiktion: ${JURISDICTION:-–})"

      - name: Render wrangler.toml
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.id }}
          PUBLIC_BASE_URL: ${{ steps.url.outputs.base }}
          MIN_APP_VERSION: ${{ vars.API_MIN_APP_VERSION }}
        run: node scripts/render-wrangler-config.mjs

      - name: Migrate D1 (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Compose Worker secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          BACKEND_KEEP_WORKER_SECRETS: ${{ vars.BACKEND_KEEP_WORKER_SECRETS }}
        run: |
          set -euo pipefail
          # Names of the secrets the Worker already has (values are never returned by Cloudflare). 404 + code 10007 =
          # Worker does not exist yet; every other failure stops here, because guessing "no secrets" would generate
          # a new SESSION_SIGNING_KEY and sign every user out.
          export EXISTING_SECRETS_FILE="$RUNNER_TEMP/kb-existing-secrets.json"
          EXISTING_SECRETS_STATUS=$(curl -sS --max-time 30 -o "$EXISTING_SECRETS_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets") || EXISTING_SECRETS_STATUS=000
          export EXISTING_SECRETS_STATUS
          node scripts/compose-secrets.mjs

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_COUNT: ${{ steps.secrets.outputs.secret_count }}
        run: |
          set -euo pipefail
          ARGS=(--message "GitHub ${GITHUB_SHA::7} (Run ${GITHUB_RUN_ID})")
          if [ "${SECRET_COUNT:-0}" != "0" ]; then ARGS+=(--secrets-file "$RUNNER_TEMP/kb-secrets.json"); fi
          npx wrangler deploy "${ARGS[@]}"

      - name: Remove provider secrets deleted in GitHub
        if: steps.secrets.outputs.stale_count != '' && steps.secrets.outputs.stale_count != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler secret bulk "$RUNNER_TEMP/kb-stale.json"

      - name: Clean up secret files
        if: always()
        run: rm -f "$RUNNER_TEMP"/kb-secrets.json "$RUNNER_TEMP"/kb-stale.json "$RUNNER_TEMP"/kb-existing-secrets.json "$RUNNER_TEMP"/kb-d1-list.json "$RUNNER_TEMP"/kb-subdomain.json wrangler.toml

      - name: Smoke test
        id: smoke
        env:
          BASE: ${{ steps.url.outputs.base }}
        run: |
          set -euo pipefail
          # A brand-new workers.dev route can take a few seconds to answer.
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors --max-time 15 \
            -H "Accept: application/json" "$BASE/v1/health"
          echo
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors --max-time 15 \
            -H "Accept: application/json" -o "$RUNNER_TEMP/kb-config.json" "$BASE/v1/config"
          jq -e '.api_version == 1' "$RUNNER_TEMP/kb-config.json" > /dev/null

      - name: Summary
        if: always() && steps.url.outputs.base != ''
        env:
          BASE: ${{ steps.url.outputs.base }}
          WORKERS_DEV: ${{ steps.url.outputs.workers_dev }}
          D1_JURISDICTION: ${{ steps.d1.outputs.jurisdiction }}
          D1_CREATED: ${{ steps.d1.outputs.created }}
          GENERATED_KEY: ${{ steps.secrets.outputs.generated_key }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          set -uo pipefail
          CONFIG="$RUNNER_TEMP/kb-config.json"
          flag() { # $1 = jq path → "aktiv" / "nicht eingerichtet" / "unbekannt"
            if [ ! -s "$CONFIG" ]; then echo "unbekannt"; return; fi
            case "$(jq -r "$1 // false" "$CONFIG" 2>/dev/null)" in
              true) echo "aktiv" ;;
              *) echo "nicht eingerichtet" ;;
            esac
          }
          HOST="${BASE#https://}"
          {
            if [ "$SMOKE" = "success" ]; then
              echo "## KlimaBilanz-Backend bereitgestellt"
            else
              echo "## KlimaBilanz-Backend: Bereitstellung unvollständig (Smoke-Test: ${SMOKE:-nicht gelaufen})"
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Worker-URL | \`$BASE\` |"
            if [ "$WORKERS_DEV" != "$BASE" ]; then echo "| workers.dev | \`$WORKERS_DEV\` |"; fi
            echo "| D1-Datenbank | \`$D1_NAME\` (Jurisdiktion: ${D1_JURISDICTION:-–}$( [ "$D1_CREATED" = "true" ] && echo ", neu angelegt")) |"
            echo "| Signaturschlüssel | $( [ "$GENERATED_KEY" = "true" ] && echo "neu erzeugt (erster Deploy)" || echo "unverändert") |"
            echo
            echo "### Anmeldung"
            echo
            echo "| Anbieter | Status |"
            echo "|---|---|"
            echo "| Google | $(flag .providers.google.web) |"
            echo "| Microsoft | $(flag .providers.microsoft.web) |"
            echo "| Apple (Web, auch für AltStore/SideStore) | $(flag .providers.apple.web) |"
            echo "| Apple (nativ, nur signierte Builds) | $(flag .providers.apple.native) |"
            echo
            echo "### Diese Adressen bei den Anbietern eintragen (exakt so)"
            echo
            echo "- **Google** – *Authorized redirect URI*: \`$BASE/v1/auth/google/callback\`"
            echo "- **Microsoft** – *Redirect URI*, Plattform **Web**: \`$BASE/v1/auth/microsoft/callback\`"
            echo "- **Apple** – Services ID › *Return URLs*: \`$BASE/v1/auth/apple/callback\` · *Domains and Subdomains*: \`$HOST\`"
            echo
            echo "Neue oder geänderte Anbieter-Secrets: danach **Actions › Backend › Run workflow**. Die App bekommt die"
            echo "URL automatisch mit dem nächsten Build (**Actions › iOS › Run workflow**). Anleitung: docs/SETUP.md §3."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$CONFIG"
