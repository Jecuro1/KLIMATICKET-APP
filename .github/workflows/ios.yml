name: iOS

# Builds the KlimaBilanz iOS app on a macOS runner and produces an unsigned .ipa
# (installable via AltStore / SideStore / Sideloadly, which re-sign with your Apple ID).
#
# Trunk-based: all work lands on main. The macOS job runs for:
#   • pushes to main, version tags (v*), pull requests, manual runs, or
#   • any push whose commit message contains "[build]" ("[shots]" / "[shots:a,b]" additionally captures simulator
#     screenshots; a manual run captures them when the "screenshots" input is set).
# Screenshots are uploaded as the run artifact "screenshots-<build>" (README.md inside names version and commit);
# there is no screenshots branch any more.
# Optional signed build + TestFlight upload kicks in automatically when the signing secrets exist (see docs/SETUP.md).

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Simulator-Screenshots aufnehmen"
        type: boolean
        default: true
      release_tag:
        description: "Release veröffentlichen, z. B. v1.0.1 (leer = kein Release). Legt Tag + GitHub Release mit .ipa, update.json und AltStore-Quelle an."
        type: string
        default: ""
      screens:
        description: "Nur diese Screenshot-Bildschirme, durch Leerzeichen oder Komma getrennt (leer = Standardliste), z. B. dashboardLive,map,settings2"
        type: string
        default: ""
      perf:
        description: "Performance-Tests (XCUITest im Simulator: Start, Scroll-Hitches je Bildschirm, Tab-Runde)"
        type: boolean
        default: false

permissions:
  contents: write

# Ordinary builds run in parallel (one group per run); releases (release_tag input or a v* tag push) are serialized
# in the single group "ios-release" so two releases never publish at the same time.
concurrency:
  group: ${{ ((github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || startsWith(github.ref, 'refs/tags/')) && 'ios-release' || format('ios-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  SCHEME: KlimaBilanz
  BUNDLE_ID: com.knitelarlberg.klimabilanz

jobs:
  core-tests:
    name: KlimaCore Tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Test KlimaCore
        shell: bash
        run: swift test --package-path Packages/KlimaCore --no-parallel 2>&1 | tail -60
      - name: Test KlimaCloud
        shell: bash
        run: |
          # Linux-testable cloud core (HTTP client, DTOs, PKCE, merge rule) – docs/CLOUDFLARE_BACKEND.md §6.
          if [ -f Packages/KlimaCloud/Package.swift ]; then
            swift test --package-path Packages/KlimaCloud --no-parallel 2>&1 | tail -60
          else
            echo "::notice::Packages/KlimaCloud gibt es in diesem Stand noch nicht – übersprungen."
          fi
      - name: Test CI scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      # Optimised build: 100 typical place searches on the full dataset must take < 50 ms (docs/PLACES.md).
      - name: Place search performance (release)
        shell: bash
        run: |
          set +e
          swift test -c release -Xswiftc -enable-testing --package-path Packages/KlimaCore --filter PlaceSearchPerformanceTests > /tmp/perf.log 2>&1
          rc=$?
          tail -15 /tmp/perf.log
          if [ $rc -ne 0 ]; then
            echo "::group::compiler / test diagnostics"
            grep -n -E -A30 "Stack dump|While (running|emitting|evaluating|silgen|type-checking)|Assertion|error:" /tmp/perf.log | grep -v "^[0-9]*-0x" | head -200
            echo "::endgroup::"
          fi
          exit $rc

  cloud-e2e:
    # The Swift cloud client against the real Worker: wrangler dev + local D1 + fake Google/Microsoft/Apple OIDC
    # (Packages/KlimaCloud/E2E/run-e2e.sh). No secrets: throwaway keys only, nothing leaves the runner.
    name: Cloud E2E (Worker + KlimaCloud, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: End-to-end (sign-in via fake providers, two devices, 1 200 rows, account switch, deletion)
        shell: bash
        run: TAIL=40 bash Packages/KlimaCloud/E2E/run-e2e.sh

  build:
    name: Build iOS (.ipa)
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[shots')
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SHOTS: ${{ (github.event_name == 'workflow_dispatch' && inputs.screenshots) || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[shots') }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          CURRENT=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "Default Xcode: $CURRENT"
          if [ "${CURRENT%%.*}" -lt 26 ]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Install tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list ldid >/dev/null 2>&1 || brew install ldid
          xcodegen --version

      - name: KlimaCore tests (macOS)
        shell: bash
        run: |
          swift test --package-path Packages/KlimaCore 2>&1 | tail -25
          if [ -f Packages/KlimaCloud/Package.swift ]; then
            swift test --package-path Packages/KlimaCloud 2>&1 | tail -25
          fi

      - name: Version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "::error::release_tag must look like v1.2.3"; exit 1; }
            VERSION="${RELEASE_TAG#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([0-9.]+)".*/\1/')
          fi
          BUILD=$((GITHUB_RUN_NUMBER + 100))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG:-${GITHUB_REF_NAME}}" >> "$GITHUB_OUTPUT"
          if [[ -n "${RELEASE_TAG}" || "$GITHUB_REF" == refs/tags/v* ]]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi
          echo "Version $VERSION ($BUILD)"

      - name: App configuration (from repository secrets/variables)
        env:
          # Cloud backend (Cloudflare Worker, docs/SETUP.md §3): repository variable API_BASE_URL (custom domain), else
          # derived from the Cloudflare account's workers.dev subdomain, else empty = the app runs local-only.
          # The token is only used to read the subdomain; scripts/write_app_config.py never prints it.
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Public repo: update.json / tariffs.json come straight from this repo's latest GitHub Release
          # (override with repository variables if the files are hosted elsewhere).
          UPDATE_MANIFEST_URL: ${{ vars.UPDATE_MANIFEST_URL || format('https://github.com/{0}/releases/latest/download/update.json', github.repository) }}
          TARIFFS_URL: ${{ vars.TARIFFS_URL || format('https://github.com/{0}/releases/latest/download/tariffs.json', github.repository) }}
        run: python3 scripts/write_app_config.py App/Resources/AppConfig.json

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project KlimaBilanz.xcodeproj -scheme "$SCHEME"

      - name: Build for device (unsigned)
        run: |
          mkdir -p build
          xcodebuild build \
            -project KlimaBilanz.xcodeproj -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/device-build.log 2>&1 || { grep -E "error:" build/device-build.log | sort -u | head -150; tail -40 build/device-build.log; exit 1; }
          grep -E "warning:" build/device-build.log | grep -v "SourcePackages" | sort -u | head -60 || true

      - name: Package .ipa
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GROUP: group.com.knitelarlberg.klimabilanz
        run: |
          set -euo pipefail
          SRC=build/device/Build/Products/Release-iphoneos/KlimaBilanz.app
          test -d "$SRC"
          rm -rf build/ipa build/entitlements dist
          mkdir -p build/ipa/Payload build/entitlements dist
          cp -R "$SRC" build/ipa/Payload/
          APP=build/ipa/Payload/KlimaBilanz.app
          # Fake-sign with the sideload entitlements so AltStore/SideStore keep the App Group when they re-sign.
          # Nested code first (frameworks, then the widget extension), the app binary last.
          for FW in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib; do
            [ -e "$FW" ] || continue
            if [ -d "$FW" ]; then FW="$FW/$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$FW/Info.plist")"; fi
            ldid -S "$FW"
          done
          for EXT in "$APP"/PlugIns/*.appex; do
            [ -d "$EXT" ] || continue
            NAME=$(basename "$EXT" .appex)
            ENT="App/Supporting/${NAME}-Sideload.entitlements"
            test -f "$ENT" || { echo "::error::$ENT fehlt – jede App-Extension braucht eigene Sideload-Entitlements"; exit 1; }
            EXE=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$EXT/Info.plist")
            ldid -S"$ENT" "$EXT/$EXE"
            ldid -e "$EXT/$EXE" > "build/entitlements/${NAME}.plist"
          done
          # Sideload builds must not request Sign in with Apple (not available to free Apple IDs).
          ldid -SApp/Supporting/KlimaBilanz-Sideload.entitlements "$APP/KlimaBilanz"
          ldid -e "$APP/KlimaBilanz" > build/entitlements/KlimaBilanz.plist
          # Sanity checks: widget embedded, App Group on app + widget, no Sign in with Apple in the sideload app.
          test -f "$APP/PlugIns/KlimaBilanzWidgets.appex/KlimaBilanzWidgets" || { echo "::error::Widget-Extension fehlt in PlugIns/"; exit 1; }
          for E in build/entitlements/*.plist; do
            echo "── $E"; cat "$E"
            grep -q "<string>$GROUP</string>" "$E" || { echo "::error::$E: App Group $GROUP fehlt"; exit 1; }
          done
          if grep -q "com.apple.developer.applesignin" build/entitlements/KlimaBilanz.plist; then
            echo "::error::Sideload-App darf keine Sign-in-with-Apple-Entitlements haben"; exit 1
          fi
          # MARK: icons – actool must have registered every alternate app icon (Einstellungen › App-Symbol).
          for ICON in AppIcon-Nacht AppIcon-Sonnenaufgang AppIcon-Gletscher AppIcon-Minimal; do
            /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons:$ICON" "$APP/Info.plist" >/dev/null \
              || { echo "::error::Alternatives App-Symbol $ICON fehlt in CFBundleAlternateIcons"; exit 1; }
          done
          IPA="dist/KlimaBilanz-${VERSION}.ipa"
          (cd build/ipa && zip -qry -X "../../$IPA" Payload)
          unzip -Z1 "$IPA" > build/ipa-files.txt
          for F in Payload/KlimaBilanz.app/KlimaBilanz Payload/KlimaBilanz.app/Info.plist \
                   Payload/KlimaBilanz.app/PlugIns/KlimaBilanzWidgets.appex/KlimaBilanzWidgets; do
            grep -qx "$F" build/ipa-files.txt || { echo "::error::$F fehlt in der .ipa"; exit 1; }
          done
          ls -la dist
          shasum -a 256 "$IPA"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlimaBilanz-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: dist/*.ipa
          if-no-files-found: error

      - name: Upload dSYM (symbolicates crash reports from Einstellungen › Diagnose & Stabilität)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dSYM-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: build/device/Build/Products/Release-iphoneos/*.dSYM
          if-no-files-found: warn
          retention-days: 90

      - name: Build for simulator
        if: env.SHOTS == 'true'
        run: |
          UDID=$(python3 scripts/pick_simulator.py)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild build \
            -project KlimaBilanz.xcodeproj -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" \
            -derivedDataPath build/sim \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            > build/sim-build.log 2>&1 || { grep -E "error:" build/sim-build.log | sort -u | head -150; tail -40 build/sim-build.log; exit 1; }

      - name: Capture screenshots
        if: env.SHOTS == 'true'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SCREENS_INPUT: ${{ inputs.screens }}
        run: |
          # "[shots:dashboard,stats]" in the commit message – or the "screens" input of a manual run – limits the captured screens.
          LIST=$(printf '%s' "$COMMIT_MSG" | grep -o '\[shots:[^]]*\]' | head -1 | sed -E 's/\[shots:([^]]*)\]/\1/' | tr ',' ' ')
          if [ -n "${SCREENS_INPUT:-}" ]; then LIST=$(printf '%s' "$SCREENS_INPUT" | tr ',' ' '); fi
          if [ -n "$LIST" ]; then export SCREENS="$LIST"; fi
          bash scripts/capture_screenshots.sh "$UDID" build/sim/Build/Products/Debug-iphonesimulator/KlimaBilanz.app shots

      - name: Screenshot README
        if: env.SHOTS == 'true'
        run: echo "Build ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }}) – ${GITHUB_SHA}" > shots/README.md

      - name: Upload screenshots artifact
        if: env.SHOTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ steps.version.outputs.build }}
          path: shots

      - name: Signed build + TestFlight (optional)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_BASE64" ]; then
            echo "Keine Signing-Secrets – überspringe signierten Build (unsignierte .ipa wurde erstellt)."
            exit 0
          fi
          bash scripts/signed_build.sh

      - name: Release metadata (update.json + AltStore source)
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          # Stable "latest" URLs for update.json / altstore-source.json / tariffs.json, so AltStore and the app always
          # see the newest release; the .ipa itself uses the immutable per-tag URL (sha256 always matches).
          DOWNLOAD_BASE: ${{ vars.PUBLIC_DOWNLOAD_BASE_URL || format('https://github.com/{0}/releases/latest/download', github.repository) }}
          # Immutable per-tag .ipa URL, so the sha256 in the source always matches the file behind it.
          IPA_DOWNLOAD_BASE: ${{ vars.PUBLIC_RELEASES_REPO != '' && format('https://github.com/{0}/releases/download/{1}', vars.PUBLIC_RELEASES_REPO, steps.version.outputs.tag) || format('https://github.com/{0}/releases/download/{1}', github.repository, steps.version.outputs.tag) }}
          MINIMUM_SUPPORTED_VERSION: ${{ vars.MINIMUM_SUPPORTED_VERSION }}
        run: |
          set -euo pipefail
          # appPermissions, version, buildVersion, size and sha256 are all derived from the final .ipa
          # (entitlements as extracted with `ldid -e` in "Package .ipa").
          python3 scripts/make_release_metadata.py dist --strict --entitlements build/entitlements/*.plist
          python3 -m json.tool dist/altstore-source.json > /dev/null
          python3 -m json.tool dist/update.json > /dev/null

      - name: GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: KlimaBilanz ${{ steps.version.outputs.version }}
          make_latest: true
          overwrite_files: true
          files: |
            dist/*.ipa
            dist/update.json
            dist/altstore-source.json
            dist/tariffs.json
            dist/AppIcon.png
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true

      - name: Publish to public releases repository (enables auto-updates)
        if: steps.version.outputs.release == 'true' && vars.PUBLIC_RELEASES_REPO != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.PUBLIC_RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: KlimaBilanz ${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            dist/*.ipa
            dist/update.json
            dist/altstore-source.json
            dist/tariffs.json
            dist/AppIcon.png
          body_path: dist/RELEASE_NOTES.md

  perf:
    # XCUITest performance tests (target KlimaBilanzPerfTests, scheme KlimaBilanzPerf, Release build) on the
    # simulator: launch time, scroll hitch ratios per screen, a tab tour with CPU/memory – plus what the app's own
    # DiagnosticsService recorded (watchdog hangs, Analytics.make timings). Only with "[perf]" in the commit message
    # or a manual run with perf=true; the regular build job is not affected.
    name: Performance (XCUITest, simulator)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.perf) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[perf]'))
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          CURRENT=$(xcodebuild -version | head -1 | awk '{print $2}')
          if [ "${CURRENT%%.*}" -lt 26 ]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install tools
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Boot simulator
        run: |
          UDID=$(python3 scripts/pick_simulator.py)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run performance tests
        id: tests
        run: |
          mkdir -p build/perf
          set +e
          xcodebuild test \
            -project KlimaBilanz.xcodeproj -scheme KlimaBilanzPerf \
            -destination "id=$UDID" \
            -derivedDataPath build/perf/dd -resultBundlePath build/perf/Perf.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            > build/perf/test.log 2>&1
          STATUS=$?
          set -e
          grep -E "error:|measured \[|Test Case .*(passed|failed)|Executed [0-9]+ test" build/perf/test.log | grep -v "SourcePackages" | tail -150 || true
          if [ $STATUS -ne 0 ]; then tail -60 build/perf/test.log; fi
          exit $STATUS

      - name: Collect the app's diagnostics
        if: always()
        run: |
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data 2>/dev/null || true)
          if [ -n "$DATA" ] && [ -d "$DATA/Library/Application Support/Diagnostics" ]; then
            cp -R "$DATA/Library/Application Support/Diagnostics" build/perf/app-diagnostics
            ls -la build/perf/app-diagnostics
          else
            echo "::notice::Keine Diagnosedaten der App gefunden"
          fi

      - name: Summary
        if: always()
        run: |
          python3 scripts/perf_summary.py build/perf/test.log --diagnostics build/perf/app-diagnostics \
            --json build/perf/perf-summary.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.run_number }}
          path: |
            build/perf/test.log
            build/perf/perf-summary.json
            build/perf/app-diagnostics
            build/perf/Perf.xcresult
          if-no-files-found: warn
          retention-days: 30
