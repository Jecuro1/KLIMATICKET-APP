name: iOS

# Builds the KlimaBilanz iOS app on a macOS runner and produces an unsigned .ipa
# (installable via AltStore / SideStore / Sideloadly, which re-sign with your Apple ID).
#
# macOS minutes are expensive on private repos, so the macOS job only runs for:
#   • pushes to main, version tags (v*), pull requests, manual runs, or
#   • any push whose commit message contains "[build]" ("[shots]" additionally captures simulator screenshots).
# Optional signed build + TestFlight upload kicks in automatically when the signing secrets exist (see docs/SETUP.md).

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Simulator-Screenshots aufnehmen"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

env:
  SCHEME: KlimaBilanz
  BUNDLE_ID: com.knitelarlberg.klimabilanz

jobs:
  core-tests:
    name: KlimaCore Tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Test KlimaCore
        shell: bash
        run: swift test --package-path Packages/KlimaCore --no-parallel 2>&1 | tail -60

  build:
    name: Build iOS (.ipa)
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[shots')
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SHOTS: ${{ (github.event_name == 'workflow_dispatch' && inputs.screenshots) || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[shots') }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          CURRENT=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "Default Xcode: $CURRENT"
          if [ "${CURRENT%%.*}" -lt 26 ]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Install tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list ldid >/dev/null 2>&1 || brew install ldid
          xcodegen --version

      - name: KlimaCore tests (macOS)
        shell: bash
        run: swift test --package-path Packages/KlimaCore 2>&1 | tail -25

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([0-9.]+)".*/\1/')
          fi
          BUILD=$((GITHUB_RUN_NUMBER + 100))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION ($BUILD)"

      - name: App configuration (from repository secrets/variables)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # Public repo: update.json / tariffs.json come straight from this repo's latest GitHub Release
          # (override with repository variables if the files are hosted elsewhere).
          UPDATE_MANIFEST_URL: ${{ vars.UPDATE_MANIFEST_URL || format('https://github.com/{0}/releases/latest/download/update.json', github.repository) }}
          TARIFFS_URL: ${{ vars.TARIFFS_URL || format('https://github.com/{0}/releases/latest/download/tariffs.json', github.repository) }}
        run: python3 scripts/write_app_config.py App/Resources/AppConfig.json

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project KlimaBilanz.xcodeproj -scheme "$SCHEME"

      - name: Build for device (unsigned)
        run: |
          mkdir -p build
          xcodebuild build \
            -project KlimaBilanz.xcodeproj -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/device-build.log 2>&1 || { grep -E "error:" build/device-build.log | sort -u | head -150; tail -40 build/device-build.log; exit 1; }
          grep -E "warning:" build/device-build.log | grep -v "SourcePackages" | sort -u | head -60 || true

      - name: Package .ipa
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GROUP: group.com.knitelarlberg.klimabilanz
        run: |
          set -euo pipefail
          SRC=build/device/Build/Products/Release-iphoneos/KlimaBilanz.app
          test -d "$SRC"
          rm -rf build/ipa build/entitlements dist
          mkdir -p build/ipa/Payload build/entitlements dist
          cp -R "$SRC" build/ipa/Payload/
          APP=build/ipa/Payload/KlimaBilanz.app
          # Fake-sign with the sideload entitlements so AltStore/SideStore keep the App Group when they re-sign.
          # Nested code first (frameworks, then the widget extension), the app binary last.
          for FW in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib; do
            [ -e "$FW" ] || continue
            if [ -d "$FW" ]; then FW="$FW/$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$FW/Info.plist")"; fi
            ldid -S "$FW"
          done
          for EXT in "$APP"/PlugIns/*.appex; do
            [ -d "$EXT" ] || continue
            NAME=$(basename "$EXT" .appex)
            ENT="App/Supporting/${NAME}-Sideload.entitlements"
            test -f "$ENT" || { echo "::error::$ENT fehlt – jede App-Extension braucht eigene Sideload-Entitlements"; exit 1; }
            EXE=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$EXT/Info.plist")
            ldid -S"$ENT" "$EXT/$EXE"
            ldid -e "$EXT/$EXE" > "build/entitlements/${NAME}.plist"
          done
          # Sideload builds must not request Sign in with Apple (not available to free Apple IDs).
          ldid -SApp/Supporting/KlimaBilanz-Sideload.entitlements "$APP/KlimaBilanz"
          ldid -e "$APP/KlimaBilanz" > build/entitlements/KlimaBilanz.plist
          # Sanity checks: widget embedded, App Group on app + widget, no Sign in with Apple in the sideload app.
          test -f "$APP/PlugIns/KlimaBilanzWidgets.appex/KlimaBilanzWidgets" || { echo "::error::Widget-Extension fehlt in PlugIns/"; exit 1; }
          for E in build/entitlements/*.plist; do
            echo "── $E"; cat "$E"
            grep -q "<string>$GROUP</string>" "$E" || { echo "::error::$E: App Group $GROUP fehlt"; exit 1; }
          done
          if grep -q "com.apple.developer.applesignin" build/entitlements/KlimaBilanz.plist; then
            echo "::error::Sideload-App darf keine Sign-in-with-Apple-Entitlements haben"; exit 1
          fi
          IPA="dist/KlimaBilanz-${VERSION}.ipa"
          (cd build/ipa && zip -qry -X "../../$IPA" Payload)
          unzip -Z1 "$IPA" > build/ipa-files.txt
          for F in Payload/KlimaBilanz.app/KlimaBilanz Payload/KlimaBilanz.app/Info.plist \
                   Payload/KlimaBilanz.app/PlugIns/KlimaBilanzWidgets.appex/KlimaBilanzWidgets; do
            grep -qx "$F" build/ipa-files.txt || { echo "::error::$F fehlt in der .ipa"; exit 1; }
          done
          ls -la dist
          shasum -a 256 "$IPA"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlimaBilanz-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: dist/*.ipa
          if-no-files-found: error

      - name: Build for simulator
        if: env.SHOTS == 'true'
        run: |
          UDID=$(python3 scripts/pick_simulator.py)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild build \
            -project KlimaBilanz.xcodeproj -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" \
            -derivedDataPath build/sim \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            > build/sim-build.log 2>&1 || { grep -E "error:" build/sim-build.log | sort -u | head -150; tail -40 build/sim-build.log; exit 1; }

      - name: Capture screenshots
        if: env.SHOTS == 'true'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # "[shots:dashboard,stats]" in the commit message limits the captured screens.
          LIST=$(printf '%s' "$COMMIT_MSG" | grep -o '\[shots:[^]]*\]' | head -1 | sed -E 's/\[shots:([^]]*)\]/\1/' | tr ',' ' ')
          if [ -n "$LIST" ]; then export SCREENS="$LIST"; fi
          bash scripts/capture_screenshots.sh "$UDID" build/sim/Build/Products/Debug-iphonesimulator/KlimaBilanz.app shots

      - name: Publish screenshots branch
        if: env.SHOTS == 'true'
        run: |
          cd shots
          git init -q
          git checkout -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Build ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }}) – ${GITHUB_SHA}" > README.md
          git add -A
          git commit -qm "Screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots

      - name: Upload screenshots artifact
        if: env.SHOTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ steps.version.outputs.build }}
          path: shots

      - name: Signed build + TestFlight (optional)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_BASE64" ]; then
            echo "Keine Signing-Secrets – überspringe signierten Build (unsignierte .ipa wurde erstellt)."
            exit 0
          fi
          bash scripts/signed_build.sh

      - name: Release metadata (update.json + AltStore source)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          DOWNLOAD_BASE: ${{ vars.PUBLIC_DOWNLOAD_BASE_URL || format('https://github.com/{0}/releases/download/{1}', github.repository, github.ref_name) }}
          # Immutable per-tag .ipa URL, so the sha256 in the source always matches the file behind it.
          IPA_DOWNLOAD_BASE: ${{ vars.PUBLIC_RELEASES_REPO != '' && format('https://github.com/{0}/releases/download/{1}', vars.PUBLIC_RELEASES_REPO, github.ref_name) || '' }}
          MINIMUM_SUPPORTED_VERSION: ${{ vars.MINIMUM_SUPPORTED_VERSION }}
        run: |
          set -euo pipefail
          # appPermissions, version, buildVersion, size and sha256 are all derived from the final .ipa
          # (entitlements as extracted with `ldid -e` in "Package .ipa").
          python3 scripts/make_release_metadata.py dist --strict --entitlements build/entitlements/*.plist
          python3 -m json.tool dist/altstore-source.json > /dev/null
          python3 -m json.tool dist/update.json > /dev/null

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ipa
            dist/update.json
            dist/altstore-source.json
            dist/tariffs.json
            dist/AppIcon.png
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true

      - name: Publish to public releases repository (enables auto-updates)
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLIC_RELEASES_REPO != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.PUBLIC_RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: KlimaBilanz ${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            dist/*.ipa
            dist/update.json
            dist/altstore-source.json
            dist/tariffs.json
            dist/AppIcon.png
          body_path: dist/RELEASE_NOTES.md
