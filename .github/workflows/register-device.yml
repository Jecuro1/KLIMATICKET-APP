name: Gerät registrieren

# Registers an iPhone for "Direkt installieren" (ad-hoc builds over the air, docs/DIREKT_INSTALLIEREN.md) through the
# App Store Connect API and refreshes the ad-hoc profiles; the next release then installs on it with one tap.
# Start it on the iPhone: GitHub app or github.com › Actions › Gerät registrieren › Run workflow › paste the UDID
# (from the page https://<backend>/v1/udid) and a name. Running it twice for the same iPhone changes nothing.
#
# This repository is PUBLIC and so are its logs: the inputs are masked in the very first step, read only from the
# event file (never through ${{ inputs.* }} in a script or an env block, which the log would show) and never printed.

on:
  workflow_dispatch:
    inputs:
      udid:
        description: "UDID des iPhones (von der Seite „Geräte-ID anzeigen“ kopiert)"
        required: true
        type: string
      name:
        description: "Name für das iPhone in deinem Apple-Konto, z. B. Mein iPhone"
        required: false
        type: string
        default: "iPhone"

permissions:
  contents: read

concurrency:
  group: register-device
  cancel-in-progress: false

jobs:
  register:
    name: iPhone registrieren
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Eingaben im Log verbergen
        run: |
          python3 - "$GITHUB_EVENT_PATH" <<'PY'
          import json, sys
          inputs = json.load(open(sys.argv[1], encoding="utf-8")).get("inputs") or {}
          for key in ("udid", "name"):
              value = " ".join(str(inputs.get(key) or "").split())
              if len(value) < 3 or value == "iPhone":
                  continue
              for variant in {value, value.upper(), value.lower(), value.replace(" ", "")}:
                  print(f"::add-mask::{variant}")
          PY

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: iPhone registrieren und Ad-hoc-Profile auffrischen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || { [ -z "$ASC_KEY_P8" ] && [ -z "$ASC_KEY_BASE64" ]; }; then
            echo "::error title=Secrets fehlen::Nötig sind ASC_KEY_ID, ASC_ISSUER_ID und ASC_KEY_P8 (Text der .p8-Datei) – docs/DIREKT_INSTALLIEREN.md, Schritt 3"
            exit 1
          fi
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          python3 scripts/asc_api.py key --out "$ASC_KEY_PATH"
          python3 scripts/asc_api.py register-device --event "$GITHUB_EVENT_PATH"
          python3 scripts/asc_api.py refresh-adhoc \
            --bundle-id com.knitelarlberg.klimabilanz --bundle-id com.knitelarlberg.klimabilanz.widgets
          {
            echo "### iPhone registriert"
            echo ""
            echo "Ab dem **nächsten Release** lässt sich KlimaBilanz auf diesem iPhone direkt installieren:"
            echo "in der App unter *Einstellungen › Updates* (Jetzt installieren) oder über die Installationsseite."
            echo "Sofort: *Actions › iOS › Run workflow* mit der nächsten Versionsnummer als \`release_tag\`."
          } >> "$GITHUB_STEP_SUMMARY"
