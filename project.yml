name: KlimaBilanz
options:
  bundleIdPrefix: com.knitelarlberg
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  KlimaCore:
    path: Packages/KlimaCore
  KlimaCloud:
    path: Packages/KlimaCloud

targets:
  KlimaBilanz:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: Shared
      - path: App/Resources
    info:
      path: App/Supporting/Info.plist
      properties:
        CFBundleDisplayName: KlimaBilanz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.knitelarlberg.klimabilanz
            CFBundleURLSchemes:
              - klimabilanz
        NSLocationWhenInUseUsageDescription: "KlimaBilanz schlägt dir die nächstgelegene Haltestelle vor, zeigt Abfahrten in deiner Nähe und zeichnet auf Wunsch eine Fahrt genau auf (nur solange die Aufzeichnung läuft). Für Live-Abfahrten wird ein auf rund 100 m gerundeter Standort an die ÖBB-Fahrplanauskunft gesendet. Der Aussteige-Wecker nutzt deinen Standort nur auf dem iPhone, solange ein Wecker scharf ist, um dich kurz vor deiner Haltestelle zu wecken – er wird nicht gespeichert und nicht gesendet."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Aussteige-Wecker: Mit „Immer“ weckt er dich auch bei gesperrtem iPhone vor deiner Haltestelle. Der Standort wird nur während einer Fahrt mit scharfem Wecker auf dem iPhone gelesen, nicht gespeichert und nicht gesendet. Hintergrund-Erkennung (Beta), nur wenn du sie einschaltest: Sie bemerkt grob, wann du dich an Bahnhöfen aufhältst und weit wegbewegst, und schlägt dir Fahrten vor, die du bestätigst; die groben Standortpunkte bleiben höchstens 36 Stunden auf deinem iPhone und verlassen es nie."
        # MARK: tripdetect – if "Genauer Standort" is off in the iOS settings, "Fahrt aufzeichnen" may ask once for the exact location
        # (CLLocationManager.requestTemporaryFullAccuracyAuthorization, purpose key "TripRecording"). No entitlement involved.
        NSLocationTemporaryUsageDescriptionDictionary:
          TripRecording: "Für die genaue Aufzeichnung deiner Fahrt braucht KlimaBilanz kurz deinen genauen Standort – nur solange die Aufzeichnung läuft, und er bleibt auf dem iPhone."
        NSUserActivityTypes:
          - com.knitelarlberg.klimabilanz.addTrip
        NSSupportsLiveActivities: true  # live: "Unterwegs" and "Live verfolgen" Live Activities
        # MARK: tripdetect – "Aufzeichnung läuft" updates its figures about every 10 s; iOS budgets Live Activity updates and this key asks
        # for the larger budget. A plain Info.plist key (the person can switch it off in the iOS settings); no entitlement, no push.
        NSSupportsLiveActivitiesFrequentUpdates: true
        # MARK: follow – background refresh of an active "Live verfolgen" (docs/OEBB_LIVE.md §R8). iOS decides when it runs.
        # MARK: exitalarm – "location" keeps the app alive in the background (blue status pill) while an Aussteige-Wecker is armed
        # and a trip runs (docs/EXIT_ALARM.md); MARK: tripdetect – the same mode keeps a running "Fahrt aufzeichnen" alive
        # (docs/TRIP_DETECTION.md). No entitlement is needed for this mode; the user's permission is.
        UIBackgroundModes:
          - fetch
          - location
        # MARK: exitalarm – the system alarm of the Aussteige-Wecker (iOS 26 AlarmKit). Needs no entitlement, only this text.
        NSAlarmKitUsageDescription: "Der Aussteige-Wecker klingelt kurz vor deiner Haltestelle, auch wenn dein iPhone lautlos gestellt ist. KlimaBilanz stellt den Wecker nur, wenn du ihn für eine Fahrt einschaltest."
        # MARK: calendarsuggestions – Kalender-Vorschläge read events only after their explanation sheet (docs/CALENDAR_SUGGESTIONS.md). No entitlement.
        NSCalendarsFullAccessUsageDescription: "Kalender-Vorschläge: KlimaBilanz liest Titel, Ort und Zeit deiner Termine der nächsten 14 Tage, nur auf diesem iPhone und nur während die App offen ist, und schlägt dir passende Zugfahrten vor. Titel und Orte werden weder gespeichert noch gesendet."
        BGTaskSchedulerPermittedIdentifiers:
          - com.knitelarlberg.klimabilanz.follow-refresh
        LSApplicationQueriesSchemes:
          - altstore
          - sidestore
          - itms-beta
          - itms-services
        KBAppGroup: group.com.knitelarlberg.klimabilanz
        KBNativeAppleSignIn: $(KB_NATIVE_APPLE_SIGNIN)
    entitlements:
      path: App/Supporting/KlimaBilanz.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.knitelarlberg.klimabilanz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.knitelarlberg.klimabilanz
        PRODUCT_NAME: KlimaBilanz
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        # MARK: icons – alternate home-screen icons (Einstellungen › Darstellung › App-Symbol), rendered by
        # scripts/render_app_icons.py; actool writes CFBundleAlternateIcons (incl. dark/tinted variants) into Info.plist.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Nacht AppIcon-Sonnenaufgang AppIcon-Gletscher AppIcon-Minimal"
        ENABLE_PREVIEWS: "YES"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        # YES only for signed builds with the Sign in with Apple capability (TestFlight/App Store).
        KB_NATIVE_APPLE_SIGNIN: "NO"
    dependencies:
      - package: KlimaCore
      - package: KlimaCloud
      - target: KlimaBilanzWidgets
        embed: true
        codeSign: true

  KlimaBilanzWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/Sources
      - path: Shared
    info:
      path: Widgets/Supporting/Info.plist
      properties:
        CFBundleDisplayName: KlimaBilanz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KBAppGroup: group.com.knitelarlberg.klimabilanz
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Supporting/KlimaBilanzWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.knitelarlberg.klimabilanz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.knitelarlberg.klimabilanz.widgets
        PRODUCT_NAME: KlimaBilanzWidgets
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
    dependencies:
      - package: KlimaCore

  # MARK: Diagnostics – XCUITest performance tests (CI job "perf": "[perf]" in the commit message or workflow_dispatch
  # perf=true). Not part of the KlimaBilanz scheme, so the regular device/simulator builds stay unchanged.
  KlimaBilanzPerfTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PerfTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.knitelarlberg.klimabilanz.perftests
        PRODUCT_NAME: KlimaBilanzPerfTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: KlimaBilanz
    dependencies:
      - target: KlimaBilanz

schemes:
  KlimaBilanz:
    build:
      targets:
        KlimaBilanz: all
    run:
      config: Debug
    archive:
      config: Release

  KlimaBilanzPerf:
    build:
      targets:
        KlimaBilanz: all
        KlimaBilanzPerfTests: [test]
    run:
      config: Release
    test:
      # Optimised build – Debug SwiftUI is several times slower and would measure the wrong thing.
      config: Release
      gatherCoverageData: false
      targets:
        - name: KlimaBilanzPerfTests
